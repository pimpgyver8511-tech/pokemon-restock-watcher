name: Pokémon-Watcher

on:
  schedule:
    # Alle 20 Minuten. GitHub startet geplante Läufe teils mit einigen Minuten Verzögerung.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      test_mail:
        description: "Nur eine Test-Mail schicken"
        type: boolean
        default: false
      shop:
        description: "Nur diesen Shop prüfen (leer = alle)"
        required: false

permissions:
  contents: read
  actions: write # für den Keepalive-Schritt unten

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      STATE_FILE: state/state.json
      DEBUG_DIR: debug
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test-Mail
        if: ${{ inputs.test_mail }}
        run: python -m watcher.main --test-mail

      # Der letzte Stand (was war schon verfügbar, welche News sind bekannt) liegt im Actions-Cache.
      - name: Stand laden
        if: ${{ !inputs.test_mail }}
        uses: actions/cache/restore@v4
        with:
          path: state
          key: watcher-state-${{ github.run_id }}
          restore-keys: watcher-state-

      - name: Shops prüfen
        if: ${{ !inputs.test_mail }}
        run: python -m watcher.main ${{ inputs.shop && format('--shop "{0}"', inputs.shop) || '' }}

      - name: Stand speichern
        if: ${{ !inputs.test_mail && !inputs.shop }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: watcher-state-${{ github.run_id }}

      # Seiten, auf denen das Produkt nicht erkannt wurde, zur Fehlersuche aufbewahren.
      - name: Debug-Seiten sichern
        if: ${{ always() && !inputs.test_mail }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: debug
          retention-days: 3
          if-no-files-found: ignore

      # GitHub pausiert geplante Workflows nach 60 Tagen ohne Repo-Aktivität; das verhindert es.
      - name: Keepalive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watch.yml/enable"
