# Filialbestand (Abholung) bei MediaMarkt und Saturn im Umkreis dieser Postleitzahl.
stores:
  postal_code: "04275"   # Leipzig-Südvorstadt
  lat: 51.3197
  lng: 12.3714
  radius_km: 10
  chains: ["MediaMarkt", "Saturn"]
  queries: ["Top-Trainer-Box 30 Jahre", "Pokemon 30 Jahre Top Trainer Box"]

# Restock-News: RSS-Feeds, neue Einträge mit passenden Stichworten werden gemeldet.
news:
  feeds:
    - "https://news.google.com/rss/search?q=%22Top-Trainer-Box%2030%20Jahre%22&hl=de&gl=DE&ceid=DE:de"
    - "https://news.google.com/rss/search?q=%22Pok%C3%A9mon%2030%20Jahre%22%20Restock%20OR%20Nachschub%20OR%20wieder%20verf%C3%BCgbar&hl=de&gl=DE&ceid=DE:de"
    - "https://news.google.com/rss/search?q=%2230th%20Celebration%22%20%22Elite%20Trainer%20Box%22%20restock&hl=en&gl=GB&ceid=GB:en"
    # Deals der mydealz-Gruppe "Pokémon" (Community meldet Restocks oft als Erstes)
    - "https://www.mydealz.de/rss/gruppe/pokemon"
    # Pokémon-TCG-Newsseiten (WordPress-Feeds)
    - "https://pokezentrum.de/feed/"
    - "https://collectors-junkies.com/feed/"
    # Tipp: Den RSS-Feed eines eigenen mydealz-Schlagwort-Alarms (Profil → Einstellungen →
    # Schlagwort-Alarme) kannst du hier zusätzlich eintragen.
  # Die Überschrift muss eines dieser Wörter enthalten (Groß-/Kleinschreibung egal) …
  must_any: ["30 jahre", "30th celebration", "jubiläum"]
  # … und Überschrift oder Text muss sich auf die Top-Trainer-/Elite-Trainer-Box beziehen.
  type_any: ["top-trainer", "top trainer", "toptrainer", "elite trainer", "elite-trainer", "ttb", "etb"]
  # Meldungen mit diesen Wörtern ignorieren (US-Deals, andere Produkte, andere Sprachen).
  exclude_any: ["$", "amazon.com", "target", "walmart", "best buy", "gamestop",
                "sticker", "mini-tin", "tin box", "booster bundle", "tcg live", "blister", "sammelmappe",
                "amazon it", "amazon fr", "amazon jp", "amazon es", "japanisch", "japanese"]
