name: Pokémon-Watcher

on:
  schedule:
    # Alle 10 Minuten anstoßen; ob wirklich geprüft wird, entscheiden Intervall und Zeitfenster
    # (Web-Oberfläche bzw. config.yaml). GitHub startet geplante Läufe teils einige Minuten später.
    - cron: "3-59/10 * * * *"
    # Einmaliger Testlauf am 29.09. um 15:25 Uhr deutscher Zeit (13:25 UTC)
    - cron: "25 13 29 9 *"
  workflow_dispatch:
    inputs:
      test_mail:
        description: "Nur eine Test-Mail schicken"
        type: boolean
        default: false
      shop:
        description: "Nur diesen Shop prüfen (leer = alle)"
        required: false

permissions:
  contents: write # Stand für die Web-Oberfläche auf den Branch "status" schreiben
  actions: write  # für den Keepalive-Schritt unten

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      STATE_FILE: state/state.json
      DEBUG_DIR: debug
      # Einstellungen aus der Web-Oberfläche (Repo-Variablen); leer = Wert aus config.yaml.
      WATCH_INTERVAL_MIN: ${{ vars.WATCH_INTERVAL_MIN }}
      WATCH_FROM_HOUR: ${{ vars.WATCH_FROM_HOUR }}
      WATCH_TO_HOUR: ${{ vars.WATCH_TO_HOUR }}
      DIGEST_HOUR: ${{ vars.DIGEST_HOUR }}
      PRICE_MIN: ${{ vars.PRICE_MIN }}
      PRICE_MAX: ${{ vars.PRICE_MAX }}
      INSTANT_ALERTS: ${{ vars.INSTANT_ALERTS }}
      EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED }}
      STATUS_FILE: status/status.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Test-Mail
        if: ${{ inputs.test_mail }}
        run: python -m watcher.main --test-mail

      # Der letzte Stand (was war schon verfügbar, welche News sind bekannt) liegt im Actions-Cache.
      - name: Stand laden
        if: ${{ !inputs.test_mail }}
        uses: actions/cache/restore@v4
        with:
          path: state
          key: watcher-state-${{ github.run_id }}
          restore-keys: watcher-state-

      - name: Shops prüfen
        if: ${{ !inputs.test_mail }}
        # Manuell gestartete Läufe prüfen immer, unabhängig von Intervall und Zeitfenster.
        run: >-
          python -m watcher.main
          ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '25 13 29 9 *') && '--force' || '' }}
          ${{ inputs.shop && format('--shop "{0}"', inputs.shop) || '' }}

      - name: Stand speichern
        if: ${{ !inputs.test_mail && !inputs.shop }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: watcher-state-${{ github.run_id }}

      # Aktuellen Stand für die Web-Oberfläche veröffentlichen (Branch "status", Datei status.json).
      - name: Stand veröffentlichen
        if: ${{ !inputs.test_mail && hashFiles('status/status.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/git/ref/heads/status" >/dev/null 2>&1 \
            || gh api -X POST "repos/$REPO/git/refs" -f ref=refs/heads/status -f sha="$GITHUB_SHA" >/dev/null
          SHA=$(gh api "repos/$REPO/contents/status.json?ref=status" --jq .sha 2>/dev/null) || SHA=""
          gh api -X PUT "repos/$REPO/contents/status.json" \
            -f branch=status -f message="Stand $(date -u +%Y-%m-%dT%H:%MZ)" \
            -f content="$(base64 -w0 status/status.json)" ${SHA:+-f sha="$SHA"} >/dev/null
          echo "status.json aktualisiert"

      # Seiten, auf denen das Produkt nicht erkannt wurde, zur Fehlersuche aufbewahren.
      - name: Debug-Seiten sichern
        if: ${{ always() && !inputs.test_mail }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: debug
          retention-days: 3
          if-no-files-found: ignore

      # GitHub pausiert geplante Workflows nach 60 Tagen ohne Repo-Aktivität; das verhindert es.
      - name: Keepalive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watch.yml/enable"
