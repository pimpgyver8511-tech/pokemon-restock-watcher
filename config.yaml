# Konfiguration des Pokémon-Restock-Watchers.
# Änderungen hier wirken beim nächsten Lauf – kein Code nötig.

product:
  name: "Pokémon 30 Jahre Top-Trainer-Box"
  eans:
    - "0196214144842"   # Deutsch: Top-Trainer-Box 30 Jahre
    - "0196214144828"   # Englisch: 30th Celebration Elite Trainer Box
  # Eine Seite gilt als "das richtige Produkt", wenn sie eine der EANs enthält
  # ODER ein Muster aus name_any UND eines aus type_any im Produktnamen vorkommt.
  name_any: ["30 jahre", "30th celebration"]
  type_any: ["top-trainer", "top trainer", "elite trainer", "elite-trainer"]
  # Varianten, die NICHT gemeint sind.
  exclude_any: ["pokémon center", "pokemon center", "2-pack", "2er", "leer", "empty", "display", "sleeves", "hüllen"]

price:
  min: 50.00   # EUR, ohne Versand
  max: 80.00

# Abrufzeiten. Werte aus der Web-Oberfläche (GitHub-Variablen) haben Vorrang.
schedule:
  interval_minutes: 20   # alle wie viel Minuten prüfen (mind. 10)
  active_from: 0         # nur zwischen active_from und active_to Uhr (deutsche Zeit) prüfen;
  active_to: 24          # 0 und 24 = rund um die Uhr, z. B. 22 und 7 = nachts

# E-Mails: eine Tagesübersicht (News, Warnungen, Stand aller Shops) ab dieser Uhrzeit (deutsche Zeit).
digest_hour: 8
# Treffer im Preisbereich sofort per Mail melden (true) oder nur in der Tagesübersicht (false)?
instant_alerts: true

# Auch melden, wenn ein Shop wieder lieferbar ist, der Preis aber außerhalb liegt?
notify_out_of_range: false

# Nach so vielen Fehlschlägen in Folge erscheint einmalig eine Warnung in der Tagesübersicht (bei 20-Min-Takt ≈ 4 h).
failure_alert_after: 12

# Shops: nur Händler, die selbst verkaufen (keine Marktplätze) und nach Deutschland liefern.
# Entfernt, weil sie automatische Abrufe dauerhaft blocken: Thalia (DE/AT), Smyths Toys, Morawa,
# Card Corner, Comicplanet.
#   urls:        bekannte Produktseiten (am zuverlässigsten)
#   search:      Such-URL, {ean} wird ersetzt; gefundene Produktlinks werden verfolgt
#   ships_to_de: "yes" = bekannt, "check" = vor dem Kauf im Warenkorb prüfen
shops:
  # --- Große Ketten Deutschland ---
  # seller_any: Angebote anderer Verkäufer (Marktplatz) werden ignoriert.
  - name: MediaMarkt
    country: DE
    ships_to_de: "yes"
    seller_any: ["mediamarkt", "media markt"]
    search:
      - "https://www.mediamarkt.de/de/search.html?query={ean}"
      - "https://www.mediamarkt.de/de/brand/pokemon-sammelkartenspiel/top-trainer-boxen"
  - name: Saturn
    country: DE
    ships_to_de: "yes"
    seller_any: ["saturn"]
    search:
      - "https://www.saturn.de/de/search.html?query={ean}"
      - "https://www.saturn.de/de/brand/pokemon-sammelkartenspiel/top-trainer-boxen"
  - name: Müller
    country: DE
    ships_to_de: "yes"
    search: "https://www.mueller.de/search/?q={ean}"
  - name: Hugendubel
    country: DE
    ships_to_de: "yes"
    search: "https://www.hugendubel.de/de/search?q={ean}"

  # --- Etablierte TCG-Fachhändler Deutschland ---
  - name: Spiele-Riese
    country: DE
    ships_to_de: "yes"
    urls:
      - "https://www.spiele-riese.de/shop/spielwelten/sammelkarten/19831/pokemon-30-jahre-top-trainer-box"
  - name: Brettspielbude
    country: DE
    ships_to_de: "yes"
    urls:
      - "https://www.brettspielbude.de/products/pokemon-30-jahre-top-trainer-box"
  - name: Cards Paradise
    country: DE
    ships_to_de: "yes"
    urls:
      - "https://www.cardsparadise.com/Pokemon-Jubilaeum-30-Jahre-Pokemon-Elite-Trainer-Box-Deutsch"
  - name: Geeksheaven
    country: DE
    ships_to_de: "yes"
    urls:
      - "https://geeksheaven.de/products/pokemon-30-jahre-top-trainer-box-deutsch-vorbestellung"
  - name: Toys for Fun
    country: DE
    ships_to_de: "yes"
    urls:
      - "https://www.toys-for-fun.com/de/pokemon-30-jahre-top-trainer-box.html"

  # --- EU (Versand nach DE im Warenkorb prüfen) ---
  - name: SpielRaum
    country: AT
    ships_to_de: "check"
    urls:
      - "https://www.spielraum.co.at/de/pokemon/product/30-jahre-top-trainer-box-de"
  - name: Master of Games (EN)
    country: ES
    ships_to_de: "check"
    urls:
      - "https://masterofgames.es/en/elite-trainer-boxes/6678--preorder-english-pokemon-tcg-30th-celebration-elite-trainer-box-0196214144828.html"

# Restock-News: RSS-Feeds, neue Einträge mit passenden Stichworten werden gemeldet.
news:
  feeds:
    - "https://news.google.com/rss/search?q=%22Top-Trainer-Box%2030%20Jahre%22&hl=de&gl=DE&ceid=DE:de"
    - "https://news.google.com/rss/search?q=%22Pok%C3%A9mon%2030%20Jahre%22%20Restock%20OR%20Nachschub%20OR%20wieder%20verf%C3%BCgbar&hl=de&gl=DE&ceid=DE:de"
    - "https://news.google.com/rss/search?q=%2230th%20Celebration%22%20%22Elite%20Trainer%20Box%22%20restock&hl=en&gl=GB&ceid=GB:en"
  # Meldungen mit diesen Wörtern ignorieren (US-Deals u. Ä.).
  exclude_any: ["$", "amazon.com", "target", "walmart", "best buy", "gamestop"]
  # Ein Eintrag muss eines dieser Wörter enthalten (Groß-/Kleinschreibung egal) ...
  must_any: ["30 jahre", "30th celebration", "jubiläum"]
  # ... und eines dieser.
  also_any: ["top-trainer", "top trainer", "elite trainer", "restock", "nachschub", "wieder verfügbar", "wieder da", "vorbestell", "lieferbar", "angebot", "deal"]
