name: Kaufland-Diagnose
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - run: sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu >/dev/null
      - run: PYTHONPATH=. python tools/probe_kaufland.py
