  - name: Cards Paradise
    country: DE
    ships_to_de: "yes"
    urls:
      - "https://www.cardsparadise.com/Pokemon-Jubilaeum-30-Jahre-Pokemon-Elite-Trainer-Box-Deutsch"
  - name: Geeksheaven
